apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-tasks-app
spec:
  strategy:                # 👈 added here
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  replicas: 2              # 👈 comes after strategy
  selector:
    matchLabels:
      app: brain-tasks-app
  template:
    metadata:
      labels:
        app: brain-tasks-app
    spec:
      containers:
        - name: brain-tasks-app
          image: roshini31/brain-tasks-app:latest
          ports:
            - containerPort: 3000
